name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e7e0d2&color_dots=#f6f8fa,#ffd5da,#ff9aa6,#ff6678,#ff3347
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e7e0d2&color_dots=#161b22,#3b0b10,#6b111b,#a51b29,#ff3347

      - name: Generate profile statistics
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${{ github.repository_owner }}&theme=github_dark" \
            --output dist/profile-stats.svg
          curl --fail --silent --show-error --retry 3 \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${{ github.repository_owner }}&theme=github_dark" \
            --output dist/profile-details.svg
          sed -i 's/#0366d6/#ff3347/g; s/#40c463/#ff3347/g' dist/profile-stats.svg dist/profile-details.svg

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
